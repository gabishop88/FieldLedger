# TODO: Update the project values? Does this matter in any way?
[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # FastAPI
    "fastapi[standard]>=0.118.0",
    "uvicorn[standard]>=0.37.0",
    # PostGIS Database
    "psycopg[binary]>=3.2.10",
    "geoalchemy2[shapely]>=0.18.1",
    "sqlmodel>=0.0.25",
    "alembic>=1.16.5",
    # Security
    "passlib[argon2]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    # Utilities
    "pydantic-settings>=2.11.0",
    "tenacity>=9.1.2",
    "uuid6>=2025.0.1",
    "requests>=2.33.1",
    "arq>=0.28.0",
    "geopandas>=1.1.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.2",
]

[tool.alembic]
script_location = "app/alembic"
prepend_sys_path = ["."]
file_template = "%%(slug)s_%%(rev)s"

[tool.ruff]
target-version = "py312"
exclude = ["alembic/**"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4", # Unnecessary list comprehensions
    "UP",
    "ARG001",
    "T201",
    "SIM",
]
ignore = ["B008", "B904"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:'crypt' is deprecated:DeprecationWarning:passlib",
    "ignore:Accessing argon2.__version__:DeprecationWarning:passlib",
    "ignore:Pydantic serializer warnings:UserWarning",
]

services:
  db:
    image: postgis/postgis:18-3.6
    container_name: fieldledger_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - fieldledger-data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    image: backend:dev
    container_name: fieldledger_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: uv run fastapi dev app/main.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  # frontend:
  #   build: ./frontend
  #   container_name: fieldledger_ui

volumes:
  fieldledger-data:
services:
  db:
    image: postgis/postgis:18-3.6
    container_name: fieldledger_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - db-data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"

  redis:
    image: redis:8
    container_name: fieldledger_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend-prestart:
    build:
      context: ./backend
    image: backend:dev
    container_name: fieldledger_prestart
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=fieldledger_db
    command: uv run python -m app.db.prestart

  backend:
    build:
      context: ./backend
    image: backend:dev
    container_name: fieldledger_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend-prestart:
        condition: service_completed_successfully
    env_file:
      - ./.env
    environment:
      - POSTGRES_SERVER=fieldledger_db
    volumes:
      - ./backend:/app
      - /app/.venv
      - /app/.uv
    ports:
      - "8000:8000"
    command: uv run fastapi dev app/main.py --host 0.0.0.0 --port 8000

  sync_worker:
    build:
      context: ./backend
    image: backend:dev
    container_name: fieldledger_sync_worker
    restart: unless-stopped
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=fieldledger_db
      - REDIS_HOST=redis
    volumes:
      - ./backend:/app
    command: uv run arq app.integrations.worker.WorkerSettings

  # frontend:
  #   build: ./frontend
  #   container_name: fieldledger_ui

volumes:
  db-data: